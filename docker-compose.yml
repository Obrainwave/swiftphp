name: swiftphp

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: swiftphp
    ports:
      - "3305:3305"

  redis:
    image: redis:7-alpine
    ports:
      - "6377:6377"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: swiftphp
    ports:
      - "5431:5431"